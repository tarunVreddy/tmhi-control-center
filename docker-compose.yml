services:
  tmhi-control-center:
    build: .
    image: tmhi-control-center:local
    container_name: tmhi-control-center
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8095}:8000"
    volumes:
      - tmhi_control_center_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  default:
    # Docker 27+ gives the network a private IPv6 subnet and routes it out
    # through the host's own address. The app's IPv6 check only reports once
    # IPv6 has actually worked, so IPv4-only hosts see no difference.
    enable_ipv6: true

volumes:
  tmhi_control_center_data:
